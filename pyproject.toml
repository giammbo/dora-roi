[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dora-roi"
version = "0.1.0"
description = "Prefill the DORA Register of Information from your infrastructure-as-code, and report what is still missing."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gianmarco Carrieri" }]
keywords = ["dora", "register-of-information", "compliance", "terraform", "eba", "ict-third-party"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/giammbo/dora-roi"
Repository = "https://github.com/giammbo/dora-roi"
Issues = "https://github.com/giammbo/dora-roi/issues"
Changelog = "https://github.com/giammbo/dora-roi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
aws = ["boto3>=1.34"]
k8s = ["kubernetes>=29.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "moto[organizations]>=5.0",
    "boto3-stubs[organizations,ce]>=1.34",
    # Reads the official EBA annotated table layout during the reconciliation.
    "openpyxl>=3.1",
    # The reference XBRL processor. Validates an exported package against the
    # official EBA taxonomy locally, so nothing is uploaded to a third party.
    "arelle-release>=2.36",
]

[project.scripts]
dora-roi = "dora_roi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dora_roi"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer builds its CLI with defaults like `typer.Option(...)` in the signature.
"src/dora_roi/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
# Without this, mypy takes each field's alias ("0010") as the __init__ parameter
# name and rejects every row built with its python name, even though
# populate_by_name accepts both at runtime.
plugins = ["pydantic.mypy"]
packages = ["dora_roi"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The kubernetes client ships neither stubs nor a py.typed marker. It is
# imported lazily behind the `k8s` extra and only for its two list_* calls,
# which the collector already treats as untyped.
[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true
