# Domain -> Terraform provider key, for vendors a DNS record or a cluster reveals.
#
# A DNS zone is a confession. An MX record names who reads your mail, a CNAME
# names who serves a subdomain, an SPF include names everyone allowed to send as
# you — and none of it appears in a `required_providers` block. On a real estate
# the Terraform providers came to one (aws) while the DNS records named eight
# more, every one of them an ICT third-party service provider in DORA's sense.
#
# Matching is on the registrable domain and never a substring: `evil-hubspot.net`
# is not HubSpot, and `hubspot.net.attacker.example` is not either.
#
# The key is the provider name used in provider_mapping.yaml, so a domain found
# here inherits that vendor's legal name, country and service codes. A key with
# no entry there still produces a row — unmapped, and visible in the gap report.
#
# **Adding a domain is the single most useful contribution to this file.**

# --- hyperscalers and their edges ------------------------------------------
amazonaws.com: aws
cloudfront.net: aws
awsapps.com: aws
amazonses.com: aws
azurewebsites.net: azurerm
azure.com: azurerm
windows.net: azurerm
# Entra ID (formerly Azure AD) login endpoint — identity, not infrastructure,
# so it maps to azuread rather than azurerm even though both are Microsoft.
microsoftonline.com: azuread
